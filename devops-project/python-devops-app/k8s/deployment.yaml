apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-devops-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: python-devops-web
  template:
    metadata:
      labels:
        app: python-devops-web
    spec:
      containers:
        - name: python-devops-web
          image: 401106839558.dkr.ecr.ap-southeast-2.amazonaws.com/python-devops-app:build-5
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: python-devops-web-service
spec:
  type: NodePort
  selector:
    app: python-devops-web
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
